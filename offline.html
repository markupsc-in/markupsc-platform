<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline — MARK UPSC</title>
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F6F7FD; font-family:'Inter',system-ui,sans-serif; color:#15172E; text-align:center; padding:24px;}
  .wrap{max-width:380px;}
  .mark{width:64px; height:64px; border-radius:16px; margin:0 auto 20px; background:linear-gradient(135deg,#4F46E5,#7C3AED); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.4rem; font-family:'Sora',system-ui,sans-serif;}
  h1{font-family:'Sora',system-ui,sans-serif; font-size:1.3rem; margin:0 0 10px;}
  p{color:#6B7094; font-size:0.95rem; line-height:1.5; margin:0 0 22px;}
  button{background:#4F46E5; color:#fff; border:none; border-radius:10px; padding:12px 22px; font-size:0.95rem; font-weight:600; cursor:pointer; font-family:inherit;}
  button:hover{background:#3C2FC9;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">MU</div>
    <h1>You're offline</h1>
    <p>MARK UPSC needs an internet connection for AI Mentor, live PYQs, and your account data. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
